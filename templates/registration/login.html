{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger">Incorrect email or password.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Email</label>
                <input type="email" name="{{ form.username.name }}" class="form-control"
                       id="{{ form.username.id_for_label }}" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                <input type="password" name="{{ form.password.name }}" class="form-control"
                       id="{{ form.password.id_for_label }}" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
