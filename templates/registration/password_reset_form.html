{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h1 class="h4 mb-3">Reset your password</h1>
        <p class="text-muted">Enter your email and we'll send you a link to set a new one.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
    </div>
</div>
{% endblock %}
