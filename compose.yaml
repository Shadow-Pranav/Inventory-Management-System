name: sits

x-app: &app
  build:
    context: .
    dockerfile: docker/web/Dockerfile
    target: ${BUILD_TARGET:-dev}
  env_file: [.env]
  volumes:
    - .:/app
    - static_volume:/app/staticfiles
    - media_volume:/app/media
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sits}
      POSTGRES_USER: ${DB_USER:-sits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sits} -d ${DB_NAME:-sits}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["${DB_PORT_HOST:-5432}:5432"]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: /app/docker/entrypoint.sh
    ports: ["${WEB_PORT:-8000}:8000"]

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency=2
    profiles: [async]

  beat:
    <<: *app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    profiles: [async]

  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025"]
    profiles: [dev]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports: ["80:80"]
    depends_on: [web]
    profiles: [prod]

volumes: {pgdata: {}, redisdata: {}, static_volume: {}, media_volume: {}}
