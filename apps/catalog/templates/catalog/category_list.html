{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Categories</h1>
    <a class="btn btn-primary btn-sm" href="{% url 'catalog:category_create' %}">New category</a>
</div>
<table class="table table-sm">
    <thead><tr><th>Name</th><th>Code</th><th>Parent</th></tr></thead>
    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td>{{ category.code }}</td>
            <td>{{ category.parent|default:"—" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-muted">No categories yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
