{% extends "base.html" %}
{% block title %}{% if department %}Edit department{% else %}New department{% endif %}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{% if department %}Edit {{ department.name }}{% else %}New department{% endif %}</h1>
<form method="post" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
