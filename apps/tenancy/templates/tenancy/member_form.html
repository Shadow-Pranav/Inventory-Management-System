{% extends "base.html" %}
{% block title %}Invite member{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Invite member</h1>
<p class="text-muted">They'll receive an email with a link to set their password.</p>
<form method="post" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send invite</button>
</form>
{% endblock %}
